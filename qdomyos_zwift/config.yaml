name: QDomyos-Zwift
version: "nightly-2026-05-05"
slug: qdomyos_zwift
description: >-
  Connect your fitness equipment to Zwift and other virtual training apps via Bluetooth.
  Access the UI through the built-in WebGL web interface.
url: https://github.com/sondregronas/hass-apps
arch:
  - amd64
init: false
privileged:
  - NET_ADMIN
host_network: true
webui: [ PROTO:option_name ]://[HOST]:8080/
image: ghcr.io/sondregronas/qdomyos-zwift-addon
map:
  - addon_config:rw
host_dbus: true
usb: true
uart: true
options:
  webgl_port: 8080
  log_level: info
schema:
  webgl_port: int
  log_level: list(trace|debug|info|notice|warning|error|fatal)
