name: QDomyos-Zwift
version: "nightly-2026-05-07-10"
slug: qdomyos_zwift
description: >-
  Runs qdomyos-zwift (by cagnulein) as a Home Assistant add-on. Access the web interface on the configured port (default: 8080). Settings persist via /addon_configs.
url: https://github.com/sondregronas/hass-apps/tree/main/qdomyos_zwift
arch:
  - amd64
init: false
privileged:
  - NET_ADMIN
  - SYS_ADMIN
host_network: true
image: ghcr.io/sondregronas/qdomyos-zwift-addon
map:
  - addon_config:rw
host_dbus: true
usb: true
uart: true
udev: true
options:
  port: 8080
  no_gui: false
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
schema:
  port: int
  no_gui: bool
  mqtt_host: str
  mqtt_port: int
  mqtt_username: str
  mqtt_password: str
