name: Update QDomyos-Zwift Add-on

on:
  schedule:
    - cron: "0 0 * * 0" # Every Sunday at 00:00 UTC
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v6

      - name: Get latest upstream release tag
        id: upstream
        run: |
          TAG=$(curl -s https://api.github.com/repos/cagnulein/qdomyos-zwift/releases/latest | jq -r .tag_name)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Latest upstream tag: $TAG"

      - name: Get current add-on version
        id: current
        run: |
          VERSION=$(grep '^version:' qdomyos_zwift/config.yaml | awk '{print $2}' | tr -d '"')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current add-on version: $VERSION"

      - name: Check if update needed
        id: needs_update
        run: |
          if [ "${{ steps.upstream.outputs.tag }}" = "${{ steps.current.outputs.version }}" ]; then
            echo "needed=false" >> $GITHUB_OUTPUT
            echo "Already up to date."
          else
            echo "needed=true" >> $GITHUB_OUTPUT
            echo "Update needed: ${{ steps.current.outputs.version }} → ${{ steps.upstream.outputs.tag }}"
          fi

      - name: Set up QEMU
        if: steps.needs_update.outputs.needed == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.needs_update.outputs.needed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.needs_update.outputs.needed == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.needs_update.outputs.needed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./qdomyos_zwift
          platforms: linux/amd64
          push: true
          build-args: |
            QDOMYOS_VERSION=${{ steps.upstream.outputs.tag }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/qdomyos-zwift-addon:${{ steps.upstream.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/qdomyos-zwift-addon:latest

      - name: Bump version in config.yaml
        if: steps.needs_update.outputs.needed == 'true'
        run: |
          sed -i "s/^version:.*/version: \"${{ steps.upstream.outputs.tag }}\"/" qdomyos_zwift/config.yaml

      - name: Commit and push version bump
        if: steps.needs_update.outputs.needed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: bump add-on to ${{ steps.upstream.outputs.tag }}"
          file_pattern: qdomyos_zwift/config.yaml


