name: Update QDomyos-Zwift Add-on

on:
  #schedule:
  #  - cron: "0 0 * * 0" # Every Sunday at 00:00 UTC
  workflow_dispatch:
  push:
    paths:
      - 'qdomyos_zwift/**'
      - '!qdomyos_zwift/**/*.md'

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v6

      - name: Get latest upstream release tag
        id: upstream
        run: |
          TAG=$(curl -s https://api.github.com/repos/cagnulein/qdomyos-zwift/releases/latest | jq -r .tag_name)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Latest upstream tag: $TAG"

      - name: Get current add-on version
        id: current
        run: |
          VERSION=$(grep '^version:' qdomyos_zwift/config.yaml | awk '{print $2}' | tr -d '"')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current add-on version: $VERSION"

      - name: Compute new version
        id: new_version
        run: |
          BASE="nightly-$(date -u +%Y-%m-%d)"
          CURRENT="${{ steps.current.outputs.version }}"
          # Check if current version is already today's base
          if [ "$CURRENT" = "$BASE" ]; then
            echo "version=${BASE}-2" >> $GITHUB_OUTPUT
          elif [[ "$CURRENT" =~ ^${BASE}-([0-9]+)$ ]]; then
            N="${BASH_REMATCH[1]}"
            echo "version=${BASE}-$((N+1))" >> $GITHUB_OUTPUT
          else
            echo "version=${BASE}" >> $GITHUB_OUTPUT
          fi
          echo "New version: $(grep 'version=' $GITHUB_OUTPUT | tail -1)"

      - name: Check if update needed
        id: needs_update
        run: |
          if [ "${{ steps.upstream.outputs.tag }}" = "${{ steps.current.outputs.version }}" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "needed=false" >> $GITHUB_OUTPUT
            echo "Already up to date."
          else
            echo "needed=true" >> $GITHUB_OUTPUT
            echo "Update needed: ${{ steps.current.outputs.version }} → ${{ steps.new_version.outputs.version }}"
          fi

      - name: Set up QEMU
        if: steps.needs_update.outputs.needed == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.needs_update.outputs.needed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.needs_update.outputs.needed == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.needs_update.outputs.needed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./qdomyos_zwift
          platforms: linux/amd64
          push: true
          build-args: |
            QDOMYOS_VERSION=${{ steps.upstream.outputs.tag }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/qdomyos-zwift-addon:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/qdomyos-zwift-addon:cache,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/qdomyos-zwift-addon:${{ steps.new_version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/qdomyos-zwift-addon:latest

      - name: Bump version in config.yaml
        if: steps.needs_update.outputs.needed == 'true'
        run: |
          sed -i "s/^version:.*/version: \"${{ steps.new_version.outputs.version }}\"/" qdomyos_zwift/config.yaml

      - name: Commit and push version bump
        if: steps.needs_update.outputs.needed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: bump add-on to ${{ steps.new_version.outputs.version }} (upstream: ${{ steps.upstream.outputs.tag }})"
          file_pattern: qdomyos_zwift/config.yaml


